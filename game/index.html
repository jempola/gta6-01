<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solmar Bay — Open-World Crime Game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #14121a; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(8, 6, 14, 0.72); z-index: 10; overflow-y: auto; }
  #overlay.hidden { display: none; }
  .panel { background: rgba(18, 16, 22, 0.95); border: 2px solid #f2c94c; border-radius: 12px; padding: 28px 32px; max-width: 560px; width: calc(100% - 48px); color: #f5f1e6; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; box-shadow: 0 12px 48px rgba(0,0,0,0.6); margin: 24px 0; }
  .panel h1 { margin: 0 0 6px; font-size: 44px; letter-spacing: 4px; color: #f2c94c; }
  .panel h2 { margin: 18px 0 8px; font-size: 16px; letter-spacing: 2px; color: #f2c94c; text-transform: uppercase; }
  .tagline { color: #b8b0a0; font-size: 15px; margin: 4px 0 12px; }
  .story { font-size: 15px; line-height: 1.5; margin: 8px 0 18px; }
  .menu-btn { display: block; width: 100%; margin: 8px 0; padding: 12px 14px; background: #26222e; color: #f5f1e6; border: 1px solid #4a4454; border-radius: 8px; font-size: 16px; font-family: inherit; cursor: pointer; text-align: left; }
  .menu-btn:hover { border-color: #f2c94c; background: #322c3e; }
  .menu-btn.primary { background: #f2c94c; color: #14121a; font-weight: 700; text-align: center; border-color: #f2c94c; }
  .menu-btn.primary:hover { background: #ffd94f; }
  .menu-sub { display: block; font-size: 13px; color: #b8b0a0; margin-top: 3px; }
  .controls { font-size: 13px; color: #b8b0a0; margin: 12px 0 0; line-height: 1.6; }
</style>
</head>
<body>
<canvas id="game" aria-label="Solmar Bay: drive, steal cars, outrun the police and run missions across an open coastal city"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<div id="overlay" class="hidden"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
