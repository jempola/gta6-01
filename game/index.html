<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Solmar Bay — Open-World Crime Game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0e1420; }
  #game { position: fixed; inset: 0; display: block; touch-action: none; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(8, 12, 22, 0.72); z-index: 10; }
  #overlay.hidden { display: none; }
  .panel { width: min(620px, 92vw); max-height: 88vh; overflow-y: auto; background: #1b2233; color: #eef1f5; border: 2px solid #f1c40f; border-radius: 12px; padding: 28px 32px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; box-shadow: 0 12px 48px rgba(0,0,0,0.6); }
  .panel h1 { margin: 0 0 6px; font-size: 44px; letter-spacing: 4px; color: #f1c40f; }
  .panel h2 { margin: 18px 0 8px; font-size: 20px; color: #f1c40f; }
  .panel p { line-height: 1.5; margin: 8px 0; }
  .panel .tag { font-size: 17px; color: #ffd94a; }
  .panel .controls { background: #11141b; border-radius: 8px; padding: 10px 14px; font-size: 14px; line-height: 1.7; }
  .panel .fine { font-size: 12px; color: #8b93a3; }
  .panel button { display: block; width: 100%; margin: 8px 0; padding: 12px; font-size: 16px; font-weight: 700; color: #111; background: #f1c40f; border: none; border-radius: 8px; cursor: pointer; }
  .panel button:hover { background: #ffd94a; }
  .panel button:disabled { background: #555; color: #999; cursor: default; }
  .panel button.mission { text-align: left; font-weight: 600; background: #2a3040; color: #eef1f5; }
  .panel button.mission:hover:not(:disabled) { background: #3a4358; }
  .panel .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .panel .row button { width: auto; flex: 1 1 40%; }
</style>
</head>
<body>
<canvas id="game" aria-label="Solmar Bay: an open-world crime game. Drive, steal cars, outrun the police and run missions."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<div id="overlay" class="hidden"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
